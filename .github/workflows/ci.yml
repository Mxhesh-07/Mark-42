name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ruff==0.17.1
      - run: python -m ruff check .

  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # Only the light dev dependencies: the suite covers the cross-platform
      # logic and never imports torch, playwright or a Windows-only package.
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # G3/G4: the declared tools, the dispatch branches, the policy table and
      # the generated README table must all agree. No heavy imports needed.
      - run: python -m agent.tool_contract --check
